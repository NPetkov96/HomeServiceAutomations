name: Deploy Azure Container Apps

on:
  push:
    branches:
      - master
    paths-ignore:
      - "BodimedMcpAdapter/**"
      - ".github/workflows/bodimed-mcp-adapter.yml"
      - ".github/workflows/azure-container-apps.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  RESOURCE_GROUP: rg-homeservice-prod
  API_APP_NAME: home-api
  BLOOD_TESTS_JOB_NAME: home-blood-tests-daily
  IMOT_BG_JOB_NAME: home-imot-bg-daily
  GHCR_REGISTRY: ghcr.io
  GHCR_NAMESPACE: npetkov96

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build solution
        run: dotnet build HomeService.sln --configuration Release

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Build and push images
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$GHCR_REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker build --file Dockerfile.api --tag "$GHCR_REGISTRY/$GHCR_NAMESPACE/home-api:${GITHUB_SHA}" .
          docker push "$GHCR_REGISTRY/$GHCR_NAMESPACE/home-api:${GITHUB_SHA}"
          docker build --file Dockerfile.jobs --tag "$GHCR_REGISTRY/$GHCR_NAMESPACE/home-jobs:${GITHUB_SHA}" .
          docker push "$GHCR_REGISTRY/$GHCR_NAMESPACE/home-jobs:${GITHUB_SHA}"

      - name: Deploy API revision
        shell: bash
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --image "$GHCR_REGISTRY/$GHCR_NAMESPACE/home-api:${GITHUB_SHA}"

      - name: Deploy daily jobs image
        shell: bash
        run: |
          for job in "$BLOOD_TESTS_JOB_NAME" "$IMOT_BG_JOB_NAME"; do
            az containerapp job update \
              --resource-group "$RESOURCE_GROUP" \
              --name "$job" \
              --image "$GHCR_REGISTRY/$GHCR_NAMESPACE/home-jobs:${GITHUB_SHA}"
          done
